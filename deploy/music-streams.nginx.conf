# Include inside the existing same-origin server block.
# Keep the API listener's short timeouts; route only media to 8082.
location ^~ /api/v1/music/streams/ {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    gzip off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    send_timeout 60s;
    # Session IDs are credentials in combination with the HttpOnly cookie.
    access_log off;
}
