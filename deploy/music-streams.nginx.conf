# Include inside the existing same-origin server block.
# Keep the API listener's short timeouts; route only media to 8082.
location ^~ /api/v1/music/streams/ {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    gzip off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    send_timeout 60s;
    # Session IDs are credentials in combination with the HttpOnly cookie.
    access_log off;
    error_log /dev/null crit;
}

# Cover create/get/stop together; never log session URLs or request credentials.
location ^~ /api/v1/music/playback-sessions {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cache off;
    access_log off;
    error_log /dev/null crit;
}
# Configure MUSIC_TRUSTED_PROXIES to the exact ingress addresses only.
# For several API instances, route both upstreams with hash $remote_addr consistent,
# using the same ordered list of instances (including create requests before a
# cookie exists). Do not switch backends during a session. Quotas/leases
# are shared through PostgreSQL; session contents are local to the selected API.
