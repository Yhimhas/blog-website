# Merge these locations into the existing server block.
# Set root to the NEW release output directory; keep the existing /api/ proxy.
# Resolve extensionless routes directly without adding a trailing slash.
location / {
    try_files $uri/index.html $uri =404;
    add_header Cache-Control "no-cache" always;
}

error_page 404 /404.html;
location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-cache" always;
}

# The emitted index.html files are implementation details, not alternate URLs.
location = /index.html { return 301 /$is_args$args; }
location ~ ^(.+)/index\.html$ { return 301 $1$is_args$args; }
location ~ ^(.+)/$ { return 301 $1$is_args$args; }
