# Merge these locations into the existing server block.
# Set server root to the SEO_CURRENT_LINK symlink; keep the existing /api/ proxy.
# Configure the path 'seo-site' below relative to the Nginx prefix (or supply
# your operator-configured path). It must be the parent of SEO_ASSETS_DIR.
# Do not enable open_file_cache for mutable HTML or cache /api/v1/posts and
# /api/v1/seo/revision; the loopback build API must always reach PostgreSQL.

# Keep hashed assets from older releases reachable during and after a switch.
location ^~ /assets/ {
    root seo-site;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /seo-release.json { return 404; }

# Resolve extensionless routes directly without adding a trailing slash.
location / {
    open_file_cache off;
    try_files $uri/index.html $uri =404;
    add_header Cache-Control "no-cache" always;
}

error_page 404 /404.html;
location = /404.html {
    internal;
    open_file_cache off;
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-cache" always;
}

# The emitted index.html files are implementation details, not alternate URLs.
location = /index.html { return 301 /$is_args$args; }
location ~ ^(.+)/index\.html$ { return 301 $1$is_args$args; }
location ~ ^(.+)/$ { return 301 $1$is_args$args; }
