    "/admin/session": {
      "post": {
        "operationId": "login",
        "summary": "login",
        "description": "设置 HttpOnly 会话 Cookie，JSON 不返回 session token。全局每分钟最多 10 次登录尝试。",
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "username": {
                    "type": "string",
                    "maxLength": 100
                  },
                  "password": {
                    "type": "string",
                    "minLength": 1,
                    "description": "最多 72 UTF-8 字节"
                  }
                },
                "required": [
                  "username",
                  "password"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "设置 HttpOnly 会话 Cookie，JSON 不返回 session token。全局每分钟最多 10 次登录尝试。",
