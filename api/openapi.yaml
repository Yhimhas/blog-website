    "/api/v1/music/playback-sessions": {
      "post": {
        "summary": "Create an anonymous cookie-bound Bilibili P1 or NetEase audio session",
        "description": "同源 Origin 和库内 trackId。默认 public_only，账号 fallback 需 licensed 策略及操作员的逐曲公开授权记录。ready 前检查 audience、完整性要求和凭据版本。capability 区分 full/preview/unknown；音频头或曲目时长不证明完整。限流、并发和输出预算可配置，生产 PostgreSQL 共享配额，可信代理由 MUSIC_TRUSTED_PROXIES 明确配置。默认关闭站内播放。",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "trackId"
                ],
                "properties": {
                  "trackId": {
                    "type": "string",
                    "maxLength": 150
                  },
                  "startSeconds": {
                    "type": "number",
                    "minimum": 0,
                    "maximum": 604800,
                    "default": 0,
                    "description": "Position relative to the available audio stream. Stop the old session before creating a replacement. Positive positions require seekMode=restart capability and must be below the available duration; preview positions are relative to the preview clip."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Preparing; poll until ready. Set-Cookie music_playback (HttpOnly, SameSite=Strict).",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/PlaybackSession"
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Safe error code in error/code with requestId"
          },
          "403": {
            "description": "Safe error code in error/code with requestId"
          },
          "404": {
            "description": "Safe error code in error/code with requestId"
          },
          "410": {
            "description": "Safe error code in error/code with requestId"
          },
          "422": {
            "description": "PLAYBACK_UNSUPPORTED or AUDIO_SOURCE_UNAVAILABLE; keep original platform link."
