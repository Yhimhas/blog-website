    "title": "个人博客与音乐 API",
    "version": "1.0.0",
    "description": "2026-09-25 后端实现契约。管理/会话响应 Cache-Control:no-store。浏览器通过同源 /api/v1 代理访问。未知路由返回 JSON 404，已知路由错误方法返回 JSON 405 + Allow。纯音频和前端接入属于独立里程碑。"
  },
