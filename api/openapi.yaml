    "/api/v1/music/streams/{id}": {
      "get": {
        "summary": "Same-domain audio stream routed to media listener",
        "description": "Cookie required. A 200 stream beginning at the session startSeconds; Range ignored, no media persistence. Seek by stopping the old session and creating a replacement with startSeconds when seekMode=restart. At most 4 streams, one per session. After headers, failures abort the connection; poll state for errorCode.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "AAC/MP4 or MP3 passthrough; incompatible supported audio containers and nonzero startSeconds are converted to 128 kbps MP3 through a pipe. No-store; time positioning uses a new session, not HTTP Range.",
            "content": {
              "audio/mp4": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              },
              "audio/mpeg": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "400": {
            "description": "Safe error code in error/code with requestId"
          },
          "403": {
            "description": "Safe error code in error/code with requestId"
          },
          "404": {
            "description": "Safe error code in error/code with requestId"
          },
          "409": {
            "description": "Duplicate connection for a session (STREAM_CONFLICT). Stream capacity returns 429 PLAYBACK_BUSY."
          },
          "410": {
            "description": "Safe error code in error/code with requestId"
          },
          "422": {
            "description": "Safe error code in error/code with requestId"
          },
          "429": {
            "description": "Safe error code in error/code with requestId"
          },
          "503": {
